[package]
name = 'llutils'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.83'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'llutils'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9'
rayon = '1'
rustc-hash = '2'
regex = '1'
aho-corasick = '1'

[profile.release]
lto = true
codegen-units = 1
